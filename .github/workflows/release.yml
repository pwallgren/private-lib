name: Release

on:
  # Publishing a release in the GitHub UI deploys that tag
  release:
    types: [published]
  # "Run workflow" button: deploys the selected branch, then creates the release
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write # needed to create the release / attach the jars

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Generates ~/.m2/settings.xml with a <server id="nexus"> using these env vars
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Derive version
        env:
          # Passed via env rather than inlined into the script to avoid shell injection
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          # Must be x.y.z (numbers only, no leading zeros), e.g. 1.2.3
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid release version '$VERSION' (from '$RAW'), expected x.y.z"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy to Nexus
        run: mvn -B -ntp deploy -Drevision="$VERSION"
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Attach jars to GitHub release
        if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" target/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
