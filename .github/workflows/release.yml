name: Release

on:
  release:
    types: [published]

permissions:
  contents: write # needed to attach the jar to the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Generates ~/.m2/settings.xml with a <server id="nexus"> using these env vars
          server-id: nexus
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Derive version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Invalid release version '$VERSION' from tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Deploy to Nexus
        run: mvn -B -ntp deploy -Drevision="$VERSION"
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

      - name: Attach jars to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" target/*.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
